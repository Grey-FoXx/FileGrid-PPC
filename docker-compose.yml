name: filegrid
x-env: &service-env
  - path: .runtime/services.env
    required: false
services:
  bootstrap:
    profiles: [tools]
    build:
      context: .
      dockerfile: infra/bootstrap.Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ./.runtime:/runtime
  postgres:
    image: postgres:17.6-bookworm
    env_file: *service-env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U filegrid -d filegrid']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  minio:
    build:
      context: .
      dockerfile: infra/minio/Dockerfile
    env_file: *service-env
    entrypoint: [/bin/sh, -ec]
    command: ['export MINIO_ROOT_USER="$$S3_ACCESS_KEY" MINIO_ROOT_PASSWORD="$$S3_SECRET_KEY"; exec minio server /data --console-address :9001']
    volumes:
      - minio-data:/data
    networks: [data]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  storage-init:
    build:
      context: .
      dockerfile: infra/storage-init.Dockerfile
    env_file: *service-env
    depends_on:
      minio: {condition: service_healthy}
    networks: [data]
  ftp:
    build:
      context: .
      dockerfile: infra/ftp/Dockerfile
    env_file: *service-env
    volumes:
      - ftp-data:/srv/ftp/data
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'kill -0 1']
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped
  api:
    build: backend
    env_file: *service-env
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/filegrid
    volumes:
      - ./.runtime:/run/filegrid:ro
      - ./config:/config:ro
    networks: [edge, data]
    depends_on:
      postgres: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
      ftp: {condition: service_healthy}
    mem_limit: 1g
    restart: unless-stopped
  gateway:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '${FILEGRID_HTTPS_PORT:-8443}:8443'
    volumes:
      - ./.runtime:/run/filegrid:ro
    networks: [edge]
    depends_on: [api]
    restart: unless-stopped
  meter-simulator:
    build: meter-simulator
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      FILEGRID_URL: http://api:8080/api/v1
      SIMULATOR_RATE: '${SIMULATOR_RATE:-1}'
      SIMULATOR_METERS: '${SIMULATOR_METERS:-10}'
      SIMULATOR_STATE: /state/pending.sqlite
    volumes:
      - ./.runtime:/run/filegrid:ro
      - ./.runtime/simulator:/state
    networks: [edge]
    depends_on: [api]
    restart: unless-stopped
  ml-worker:
    build: ml-service
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      FILEGRID_URL: http://api:8080
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    volumes:
      - ./.runtime:/run/filegrid:ro
    networks: [edge]
    depends_on: [api]
    mem_limit: 512m
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.7.3
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [edge]
    depends_on: [api]
    restart: unless-stopped
networks:
  edge:
  data:
    internal: true
volumes:
  postgres-data:
  minio-data:
  ftp-data:
  prometheus-data:
