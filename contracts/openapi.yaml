    "/policies": {
      "get": {
        "summary": "Active policies",
        "operationId": "get__policies",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/StoragePolicyConfig"
                }
              }
            }
          },
          "default": {
            "description": "Problem",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        }
      },
      "put": {
        "summary": "Replace ordered storage policies for new sessions (ADMIN only)",
        "operationId": "put__policies",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "expectedVersion",
                  "rules"
                ],
                "additionalProperties": false,
                "properties": {
                  "expectedVersion": {
                    "type": "integer",
                    "minimum": 1
                  },
                  "rules": {
                    "type": "array",
                    "items": {
                      "$ref": "#/components/schemas/StoragePolicyRule"
                    }
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Persisted configuration with its newly incremented version",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/StoragePolicyConfig"
                }
              }
            }
          },
          "409": {
            "description": "The expected configuration version is stale"
          },
          "422": {
            "description": "Malformed policy, unsupported destination or missing category fallback"
          },
          "default": {
            "description": "Problem",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        }
      }
    },
