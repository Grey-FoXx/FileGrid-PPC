              "schema": {
                "$ref": "#/components/schemas/UploadInput"
              }
            }
          }
        },
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ]
      }
    },
    "/upload-sessions/{id}": {
      "get": {
        "summary": "Resume information",
        "operationId": "get__upload-sessions_id",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
