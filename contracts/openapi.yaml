    "/incident-groups/{id}/status": {
      "patch": {
        "summary": "Advance a group NEW → DISPATCHED → RESOLVED",
        "operationId": "patch__incident-groups_id_status",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "status"
                ],
                "properties": {
                  "status": {
                    "type": "string",
                    "enum": [
                      "NEW",
                      "DISPATCHED",
                      "RESOLVED"
                    ]
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Updated group status"
          },
          "409": {
            "description": "Invalid or stale transition"
          },
          "default": {
            "description": "Problem",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        }
      }
    },
    "/demo": {
      "get": {
        "summary": "Demo capability, seed and generator status",
        "operationId": "get__demo",
        "responses": {
          "200": {
            "description": "Demo status"
          }
        },
        "description": "Always available; no environment flag required. Status includes flow.multiplier, bounded notifications, integrityProbes and fileFeedLimited. Probe recovery applies only to generated synthetic fixtures with an independent recovery copy; no repair guarantee for arbitrary user files."
      }
    },
    "/demo/initialize": {
      "post": {
        "summary": "Create the bounded tagged demo seed once",
        "operationId": "post__demo_initialize",
        "responses": {
          "200": {
            "description": "Seed status"
          },
          "409": {
            "description": "Demo-scoped data already exists"
          }
        }
      }
    },
    "/demo/reset": {
      "post": {
        "summary": "Reset and reseed only tagged demo resources",
        "operationId": "post__demo_reset",
        "responses": {
          "200": {
            "description": "Reset seed status"
          }
        }
      }
    },
    "/demo/mode": {
      "post": {
        "summary": "Set server-side NORMAL or STORM generation mode",
        "operationId": "post__demo_mode",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "mode"
                ],
                "properties": {
                  "mode": {
                    "type": "string",
                    "enum": [
                      "NORMAL",
                      "STORM"
                    ]
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Demo mode status"
          },
          "409": {
            "description": "Demo is not initialized"
          }
        }
      }
    },
    "/policies/reset": {
      "post": {
        "summary": "Restore bootstrap rules using a new monotonic version (ADMIN only)",
        "operationId": "post__policies_reset",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "expectedVersion"
                ],
                "additionalProperties": false,
                "properties": {
                  "expectedVersion": {
                    "type": "integer",
                    "minimum": 1
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Restored bootstrap configuration with incremented version",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/StoragePolicyConfig"
                }
              }
            }
          },
          "409": {
            "description": "The expected configuration version is stale"
          },
          "422": {
            "description": "Malformed request"
          },
          "default": {
            "description": "Problem",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        }
      }
    },
    "/simulator": {
      "get": {
        "summary": "Read actual multiplier and demo epoch (ADMIN, DISPATCHER, METER_INGEST)",
        "responses": {
          "200": {
            "description": "Current control or probe result"
          },
          "403": {
            "description": "Role not permitted"
          }
        },
        "operationId": "get_simulator"
      }
    },
    "/demo/volume": {
      "put": {
        "summary": "Set durable shared simulator multiplier 1 to 10 (ADMIN)",
        "responses": {
          "200": {
            "description": "Current control or probe result"
          },
          "403": {
            "description": "Role not permitted"
          },
          "422": {
            "description": "Invalid multiplier"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "multiplier"
                ],
                "properties": {
                  "multiplier": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 10
                  }
                }
              }
            }
          }
        },
        "operationId": "put_demo_volume"
      }
    },
    "/demo/notifications/test": {
      "post": {
        "summary": "Publish an explicitly synthetic in-app team notification (ADMIN)",
        "responses": {
          "200": {
            "description": "Current control or probe result"
          },
          "403": {
            "description": "Role not permitted"
          }
        },
        "operationId": "post_demo_notifications_test"
      }
    },
    "/demo/integrity-probes": {
      "post": {
        "summary": "Create an isolated S3 corruption and automatic recovery fixture (ADMIN)",
        "responses": {
          "200": {
            "description": "Current control or probe result"
          },
          "403": {
            "description": "Role not permitted"
          }
        },
        "operationId": "post_demo_integrity_probes"
      }
    }
  },
  "components": {
    "securitySchemes": {
      "basicAuth": {
        "type": "http",
        "scheme": "basic"
      }
    },
    "schemas": {
      "Problem": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string"
          },
          "status": {
            "type": "integer"
          },
          "detail": {
            "type": "string"
          },
          "correlationId": {
            "type": "string"
          }
        }
      },
      "Me": {
        "type": "object",
        "properties": {
          "username": {
            "type": "string"
          },
          "role": {
            "type": "string"
          },
          "features": {
            "type": "object",
            "properties": {
              "demo": {
                "type": "boolean"
              },
              "incidentGroups": {
                "type": "boolean"
              }
            }
          }
        }
      },
      "IncidentInput": {
        "type": "object",
        "properties": {
          "stationId": {
            "type": "string"
          },
          "zone": {
            "type": "string"
          },
          "eventType": {
            "type": "string"
          },
          "severity": {
            "type": "integer",
            "minimum": 1,
            "maximum": 5
          },
          "affectedCustomers": {
            "type": "integer",
            "minimum": 0
          },
          "latitude": {
            "type": "number"
          },
          "longitude": {
            "type": "number"
          },
          "safetyCritical": {
            "type": "boolean"
          }
        },
        "required": [
          "stationId",
          "zone",
          "eventType",
          "severity"
        ]
      },
      "UploadInput": {
        "type": "object",
        "properties": {
          "category": {
            "type": "string",
            "enum": [
              "INCIDENT",
              "CONNECTION_DOCUMENT",
              "DRONE_VIDEO"
            ]
          },
          "filename": {
            "type": "string"
          },
          "contentType": {
            "type": "string"
          },
          "sizeBytes": {
            "type": "integer",
            "minimum": 1
          },
          "sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "incidentId": {
            "type": "string"
          },
          "applicationId": {
            "type": "string"
          },
          "documentType": {
            "type": "string"
          },
          "attachmentType": {
            "type": "string"
          },
          "sensitivity": {
            "type": "string"
          }
        },
        "required": [
          "category",
          "filename",
          "contentType",
          "sizeBytes",
          "sha256"
        ]
      },
      "Session": {
        "type": "object",
        "properties": {
          "sessionId": {
            "type": "string"
          },
          "fileId": {
            "type": "string"
          },
          "uploadMode": {
            "type": "string",
            "enum": [
              "SINGLE",
              "MULTIPART"
            ]
          },
          "partSizeBytes": {
            "type": "integer"
          },
          "expiresAt": {
            "type": "string"
          },
          "status": {
            "type": "string"
          },
          "confirmedParts": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "number": {
                  "type": "integer"
                },
                "sha256": {
                  "type": "string"
                },
                "sizeBytes": {
                  "type": "integer"
                }
              }
            }
          }
        }
      },
      "File": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "category": {
            "type": "string"
          },
          "filename": {
            "type": "string"
          },
          "contentType": {
            "type": "string"
          },
          "sizeBytes": {
            "type": "integer"
          },
          "sha256": {
            "type": "string"
          },
          "status": {
            "type": "string"
          },
          "storage": {
            "type": "string"
          },
          "owner": {
            "type": "string"
          },
          "policyVersion": {
            "type": "string"
          },
          "routingReason": {
            "type": "string"
          },
          "integrityStatus": {
            "type": "string"
          },
          "createdAt": {
            "type": "string"
          },
          "incidentId": {
            "type": "string"
          }
        }
      },
      "Incident": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "stationId": {
            "type": "string"
          },
          "zone": {
            "type": "string"
          },
          "eventType": {
            "type": "string"
          },
          "severity": {
            "type": "integer"
          },
          "affectedCustomers": {
            "type": "integer"
          },
          "mlStatus": {
            "type": "string"
          },
          "analysis": {
            "type": "object"
          },
          "attachments": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/File"
            }
          },
          "groupId": {
            "type": "string",
            "nullable": true
          },
          "interventionStatus": {
            "type": "string",
            "enum": [
              "NEW",
              "DISPATCHED",
              "RESOLVED"
            ],
            "nullable": true
          }
        }
      },
      "MeterReading": {
        "title": "MeterReading",
        "type": "object",
        "required": [
          "schema_version",
          "reading_id",
          "meter_id",
          "sequence_number",
          "measured_at",
          "energy_kwh"
        ],
        "properties": {
          "schema_version": {
            "type": "integer",
            "enum": [
              1
            ]
          },
          "reading_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "meter_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "sequence_number": {
            "type": "integer",
            "minimum": 1
          },
          "measured_at": {
            "type": "string",
            "format": "date-time"
          },
          "energy_kwh": {
            "type": "number",
            "minimum": 0
          }
        }
      },
      "Page": {
        "type": "object",
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "type": "object"
            }
          },
          "page": {
            "type": "integer"
          },
          "size": {
            "type": "integer"
          },
          "total": {
            "type": "integer"
          }
        }
      },
      "IncidentGroupPage": {
        "type": "object",
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/IncidentGroup"
            }
          },
          "total": {
            "type": "integer"
          }
        }
      },
      "IncidentGroup": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "type": "string",
            "enum": [
              "NEW",
              "DISPATCHED",
              "RESOLVED"
            ]
          },
          "zone": {
            "type": "string"
          },
          "eventType": {
            "type": "string"
          },
          "severity": {
            "type": "integer"
          },
          "latitude": {
            "type": "number",
            "nullable": true
          },
          "longitude": {
            "type": "number",
            "nullable": true
          },
          "incidents": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Incident"
            }
          },
          "groupAnalysis": {
            "type": "object"
          }
        }
      },
      "StoragePolicyConfig": {
        "type": "object",
        "required": [
          "version",
          "rules"
        ],
        "properties": {
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "rules": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/StoragePolicyRule"
            }
          }
        }
      },
      "StoragePolicyRule": {
        "description": "First matching rule wins. All categories support DATABASE, S3 and FTP. Connection documents are encrypted before every destination; drone multipart is resumable for every destination. Every category requires an unconditional fallback.",
        "type": "object",
        "required": [
          "id",
          "category",
          "storage"
        ],
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120,
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
          },
          "category": {
            "type": "string",
            "enum": [
              "METER_READING",
              "INCIDENT",
              "CONNECTION_DOCUMENT",
              "DRONE_VIDEO"
            ]
          },
          "storage": {
            "type": "string",
            "enum": [
              "DATABASE",
              "S3",
              "FTP"
            ]
          },
          "attachmentType": {
            "type": "string",
            "enum": [
              "BINARY",
              "LEGACY_LOG"
            ]
          },
          "sensitivity": {
            "type": "string",
            "enum": [
              "SENSITIVE",
              "NON_SENSITIVE"
            ]
          }
        }
      }
    }
  }
}
