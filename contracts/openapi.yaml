  },
  "components": {
    "securitySchemes": {
      "basicAuth": {
        "type": "http",
        "scheme": "basic"
      }
    },
    "schemas": {
      "Problem": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string"
          },
          "status": {
            "type": "integer"
          },
          "detail": {
            "type": "string"
          },
          "correlationId": {
            "type": "string"
          }
        }
      },
      "Me": {
        "type": "object",
        "properties": {
          "username": {
            "type": "string"
          },
          "role": {
            "type": "string"
          }
        }
      },
      "IncidentInput": {
        "type": "object",
        "properties": {
          "stationId": {
            "type": "string"
          },
          "zone": {
            "type": "string"
          },
          "eventType": {
            "type": "string"
          },
          "severity": {
            "type": "integer",
            "minimum": 1,
            "maximum": 5
          },
          "affectedCustomers": {
            "type": "integer",
            "minimum": 0
          },
          "latitude": {
            "type": "number"
          },
          "longitude": {
            "type": "number"
          },
          "safetyCritical": {
            "type": "boolean"
          }
        },
        "required": [
          "stationId",
          "zone",
          "eventType",
          "severity"
        ]
      },
      "UploadInput": {
        "type": "object",
        "properties": {
          "category": {
            "type": "string",
            "enum": [
              "INCIDENT",
              "CONNECTION_DOCUMENT",
              "DRONE_VIDEO"
            ]
          },
          "filename": {
            "type": "string"
          },
          "contentType": {
            "type": "string"
          },
          "sizeBytes": {
            "type": "integer",
            "minimum": 1
          },
          "sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "incidentId": {
            "type": "string"
          },
          "applicationId": {
            "type": "string"
          },
          "documentType": {
            "type": "string"
          },
          "attachmentType": {
            "type": "string"
          },
          "sensitivity": {
            "type": "string"
          }
        },
        "required": [
          "category",
          "filename",
          "contentType",
          "sizeBytes",
          "sha256"
        ]
      },
      "Session": {
        "type": "object",
        "properties": {
          "sessionId": {
            "type": "string"
          },
          "fileId": {
            "type": "string"
          },
          "uploadMode": {
            "type": "string",
            "enum": [
              "SINGLE",
              "MULTIPART"
            ]
          },
          "partSizeBytes": {
            "type": "integer"
          },
          "expiresAt": {
            "type": "string"
          },
          "status": {
            "type": "string"
          },
          "confirmedParts": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "number": {
                  "type": "integer"
                },
                "sha256": {
                  "type": "string"
                },
                "sizeBytes": {
                  "type": "integer"
                }
              }
            }
          }
        }
      },
      "File": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "category": {
            "type": "string"
          },
          "filename": {
            "type": "string"
          },
          "contentType": {
            "type": "string"
          },
          "sizeBytes": {
            "type": "integer"
          },
          "sha256": {
            "type": "string"
          },
          "status": {
            "type": "string"
          },
          "storage": {
            "type": "string"
          },
          "owner": {
            "type": "string"
          },
          "policyVersion": {
            "type": "string"
          },
          "routingReason": {
            "type": "string"
          },
          "integrityStatus": {
            "type": "string"
          },
          "createdAt": {
            "type": "string"
          },
          "incidentId": {
            "type": "string"
          }
        }
      },
      "Incident": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "stationId": {
            "type": "string"
          },
          "zone": {
            "type": "string"
          },
          "eventType": {
            "type": "string"
          },
          "severity": {
            "type": "integer"
          },
          "affectedCustomers": {
            "type": "integer"
          },
          "mlStatus": {
            "type": "string"
          },
          "analysis": {
            "type": "object"
          },
          "attachments": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/File"
            }
          }
        }
      },
      "MeterReading": {
        "title": "MeterReading",
        "type": "object",
        "required": [
          "schema_version",
          "reading_id",
          "meter_id",
          "sequence_number",
          "measured_at",
          "energy_kwh"
        ],
        "properties": {
          "schema_version": {
            "type": "integer",
            "enum": [
              1
            ]
          },
          "reading_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "meter_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "sequence_number": {
            "type": "integer",
            "minimum": 1
          },
          "measured_at": {
            "type": "string",
            "format": "date-time"
          },
          "energy_kwh": {
            "type": "number",
            "minimum": 0
          }
        }
      },
      "Page": {
        "type": "object",
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "type": "object"
            }
          },
          "page": {
            "type": "integer"
          },
          "size": {
            "type": "integer"
          },
          "total": {
            "type": "integer"
          }
        }
      }
    }
  }
}
