# Query strings, credentials and uploaded filenames are excluded from access logs.
log_format filegrid escape=json '{"time":"$time_iso8601","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"correlationId":"$http_x_correlation_id"}';
access_log /var/log/nginx/access.log filegrid;
server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /run/filegrid/tls.crt;
    ssl_certificate_key /run/filegrid/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 11m;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
    location /internal/ { return 404; }
    location /actuator/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
