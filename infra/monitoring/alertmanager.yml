global:
  resolve_timeout: 30s
route:
  receiver: filegrid-internal
  group_by: [alertname, category, storage]
  group_wait: 1s
  group_interval: 10s
  repeat_interval: 30m
receivers:
  - name: filegrid-internal
    webhook_configs:
      - url: http://api:8080/internal/v1/alerts/receive
        send_resolved: true
        max_alerts: 100
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/filegrid/alerts.token
